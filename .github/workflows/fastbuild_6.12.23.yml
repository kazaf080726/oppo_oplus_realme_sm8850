            # 涓旂Щ鍔ㄥ熀绔欑紦鍐插尯娣卞害閫氬父杈冨皬锛垀50ms锛夛紝BBR 鐨勫甫瀹芥帰娴嬮樁娈碉紙ProbeRTT锛夎繃搴﹂檷绐楀彲鑳藉鑷村悶鍚愰噺楠ら檷锛屼笖缃戠粶鍒囨崲锛圵iFi鈫?G锛夋椂闇€閲嶆柊
            # 鎺㈡祴鍙傛暟锛屽弽鑰屽鍔犲欢杩熸垨瀵艰嚧閫熺巼鎸崱锛堢煭鏆傚崱椤匡級锛屼笖瀛樺湪 RTT 涓嶅叕骞虫€э紝涓庡熀浜庝涪鍖呯殑娴佺珵浜夋椂鍙兘杩囦簬寮哄娍锛屽湪娣峰悎缃戠粶鐜涓?            #锛堝 BBR + CUBIC 鍏卞瓨锛夛紝BBR 浼氭姠鍗犳洿澶氬叾浠栬蒋浠剁殑甯﹀锛岄檷浣庡叾浠栧簲鐢ㄧ殑鍏钩鎬э紙濡傚悗鍙拌蒋浠舵洿鏂板奖鍝嶅墠鍙拌棰戞挱鏀撅級銆?            # 鍥犳锛岃櫧鐒禕BR鍙互鏄捐憲鍑忓皯鎺掗槦寤惰繜锛屾姉涓㈠寘鑳藉姏寮猴紝甯﹀鍒╃敤鐜囬珮锛屼絾鐢变簬鍏朵細澧炲姞鑰楃數锛屼笖鏄撳鑷寸綉缁滈€熺巼娉㈠姩锛屾晠瀹夊崜绯荤粺榛樿涓嶄娇鐢?            # BBR鎷ュ绠楁硶锛岃€屾槸浣跨敤鍦ㄥ悶鍚愰噺銆佺ǔ瀹氭€с€佸吋瀹规€с€佽兘鏁堜箣闂村彇寰楁渶浣冲钩琛＄殑CUBIC绠楁硶銆傚湪寮€鍚疊BR鍓嶏紝璇疯€冭檻鑷繁鏄惁鐪熺殑鏈変娇鐢˙BR鐨勫繀瑕併€?            ################################################################################################################################
            echo "CONFIG_TCP_CONG_BBR=y" >> ./common/arch/arm64/configs/gki_defconfig
            #CUBIC锛氬畨鍗撶殑榛樿TCP鎷ュ鎺у埗绠楁硶锛屽湪鍚炲悙閲忋€佺ǔ瀹氭€с€佸吋瀹规€с€佽兘鏁堜箣闂村彇寰楁渶浣冲钩琛★紝鍏锋湁楂樺吋瀹规€т笌鍏钩鎬с€佹姉缃戠粶娉㈠姩鎬у己銆佷綆璁＄畻寮€閿€鐨勭壒鐐癸紝鏄粷澶ч儴鍒嗙Щ鍔ㄥ満鏅殑浼樺厛閫夋嫨
            echo "CONFIG_TCP_CONG_CUBIC=y" >> ./common/arch/arm64/configs/gki_defconfig
            #VEGAS锛氬熀浜庢椂寤剁殑鎷ュ鎺у埗绠楁硶涔嬩竴锛屽皢鍥炶矾鍝嶅簲鏃堕棿锛圧ound Trip Time锛孯TT锛夊鍔犺涓哄嚭鐜版嫢濉烇紝澧炲姞鏃跺澶ф嫢濉炵獥鍙ｏ紝鍑忓皬鏃跺噺灏忔嫢濉炵獥鍙?            echo "CONFIG_TCP_CONG_VEGAS=y" >> ./common/arch/arm64/configs/gki_defconfig
            #New Vegas锛歏egas 绠楁硶鐨勬敼杩涚増锛屼紭鍖栦簡 RTT 娴嬮噺鍜岀珵浜夊叕骞虫€э紝鍙互鏇村噯纭湴妫€娴嬫嫢濉烇紝涓?Reno/CUBIC 鍏卞瓨鑳藉姏鎻愬崌
            echo "CONFIG_TCP_CONG_NV=y" >> ./common/arch/arm64/configs/gki_defconfig
            #Westwood+锛氬熀浜庡甫瀹戒及璁★紙ACK 鍒拌揪鐜囷級鍔ㄦ€佽缃嫢濉炵獥鍙ｅ拰鎱㈠惎鍔ㄩ槇鍊硷紱蹇€熸仮澶嶏紝閫傚悎鏃犵嚎缃戠粶锛堝尯鍒嗘嫢濉炰涪鍖呬笌鏃犵嚎涓㈠寘锛?            echo "CONFIG_TCP_CONG_WESTWOOD=y" >> ./common/arch/arm64/configs/gki_defconfig
            #HTCP锛氫竴绉嶅熀浜庢崯澶辩殑绠楁硶锛屼娇鐢?AIMD 鏉ユ帶鍒舵嫢濉炵獥鍙ｏ紝鏍规嵁 RTT 鍔ㄦ€佽皟鏁村闀垮洜瀛愶紝缁撳悎寤惰繜鍜屼涪鍖呬俊鍙凤紝閽堝楂樺欢杩熺殑楂橀€熺綉缁滆繘琛屼紭鍖?            echo "CONFIG_TCP_CONG_HTCP=y" >> ./common/arch/arm64/configs/gki_defconfig
            #brutal锛氫竴绉嶉€氳繃涓诲姩鎺㈡祴 + 婵€杩涙姠鍗犳渶澶у寲鍚炲悙閲忕殑鎷ュ绠楁硶锛屾棤鎷ュ绐楀彛涓婇檺锛岃交搴︿涪鍖咃紙<20%锛変笉闄嶇獥锛岄伩鍏嶇被浼?BBR 鐨?ProbeRTT 闃舵锛?            #鎸佺画缁存寔楂樺彂閫侀€熺巼锛屼笌 Reno/CUBIC 鍏卞瓨鏃讹紝Brutal 鍙€氳繃楂橀鍙戝寘鎶㈠崰 90%+ 甯﹀锛岄€傜敤浜庨珮涓㈠寘寮辩綉鐜锛堝鍏叡 Wi-Fi銆佽渹绐濈綉缁滐級鍙?            #鐩存挱鎺ㄦ祦銆佷簯娓告垙涓婅閾捐矾绛夐渶浼樺厛淇濊瘉鍚炲悙閲忚€岄潪寤惰繜鏁忔劅鐨勫満鏅紝鎻愬崌寮辩綉鍚炲悙鎬ц兘锛屽鎶楄繍钀ュ晢 QoS 闄愰€熴€備絾鐢变簬TCP Brutal 浠呭湪搴旂敤绋嬪簭
