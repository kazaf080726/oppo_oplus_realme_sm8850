name: 6.12.23 娆у姞鐪烵KI鍐呮牳蹇€熸瀯寤?
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '23'
  KERNEL_NAME: 'android16-5-ga8f88ad96df3-ab13929693-4k'
  CCACHE_KEY: ccache-ecsv4-6.12.23

on:
  workflow_dispatch:
    inputs:
      nomount_enable:
        description: '鏄惁鍐呯疆 NoMount 鍐呮牳椹卞姩骞跺祵鍏ユ渶鏂?metamodule锛堟瘡娆℃瀯寤虹幇鎷夋渶鏂?Release锛?
        required: true
        type: boolean
        default: true
      ksu_type:
        description: 'KernelSU鍒嗘敮(BakaSU/SukiSU Ultra/KernelSU Next/KSU(鍘熺増)/鏃犲唴缃甂SU,榛樿BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '鏄惁寮€鍚痵usfs(鐢ㄤ簬澧炲己闅愯棌鐜鎸傝浇鍔熻兘; 鍙兘杞诲井澧炲姞鑰楃數锛屼笂娓告洿鏂板鑷翠笉绋冲畾鏃舵垨涓嶉渶瑕佸彲鍏抽棴)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '鏄惁寮€鍚痥pm(浣跨敤KpatchNext鐙珛瀹炵幇kpm(鏀寔浠绘剰KSU/闈㈠叿鐜); 涓嶉渶瑕佸彲淇濇寔榛樿鍏抽棴)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '鏄惁瀹夎 lz4 1.10.0+zstd 1.5.7 琛ヤ竵'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '鏄惁瀹夎 LZ4KD 琛ヤ竵(鑻ュ凡寮€鍚痩z4+zstd琛ヤ竵鍒欏彲涓嶅紑鍚?'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "鏄惁鍚敤bbr绠楁硶(浼樺寲涓婅鏁版嵁,瀵规墜鏈烘棩鐢ㄦ棤澶ぇ鎰忎箟鐢氳嚦鍙兘璐熶紭鍖?false鍏抽棴,true浠呭姞鍏ョ畻娉?default鍚敤绠楁硶骞惰涓洪粯璁?"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '鏄惁鍚敤Droidspaces瀹瑰櫒鏀寔(杞婚噺鍖栫殑瀹屾暣Linux瀹瑰櫒鏀寔;false鍏抽棴,standard寮€鍚鍣?ntsync鏀寔,extend寮€鍚洿澶氭祴璇曟敮鎸侀」)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '鏄惁寮€鍚綉缁滃姛鑳芥嫇灞曢厤缃?鐢ㄤ簬涓篿pset鍙婇渶瑕乮ptables绛夐珮绾х綉缁滃姛鑳藉唴鏍告敮鎸佺殑绋嬪簭鎻愪緵鏀寔)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '鏄惁鍚敤ADIOS IO璋冨害鍣ㄦ敮鎸?鎻愬崌IO璇诲啓鎬ц兘)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '鏄惁鍚敤Re-Kernel鏀寔(涓嶧reezer/NoActive绛夎蒋浠堕厤鍚? 鎻愬崌搴旂敤鍐荤粨鑳藉姏)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '鏄惁寮€鍚唴鏍哥骇鍩哄甫淇濇姢(闃绘涓€鍒囧闈炵敤鎴峰垎鍖虹殑鍐欏叆锛屾湁鏁堥槻姝㈡牸鏈?'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '鏇存柊ccache缂撳瓨(灏嗘湰娆＄紪璇戠敓鎴愮殑ccache缂撳瓨瑕嗙洊鑷充粨搴撶紦瀛橈紝鍦ㄦ洿鏀圭紪璇戦厤缃€佹簮鐮佹垨闇€瑕佸埛鏂扮紦瀛樻椂寮€鍚?'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '鏄惁涓婁紶 Ccache璋冭瘯鏃ュ織(鐢ㄤ簬璋冭瘯, 鏃犻渶瑕佷笉蹇呭紑鍚?'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '鍐呮牳鍚庣紑(鐣欑┖榛樿,寮€澶村埆鍔犺繛瀛楃,鍕垮姞绌烘牸绛夊奖鍝嶆寚浠よ繍琛岀殑淇濈暀瀛楃)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 瀹夎鐜渚濊禆+鍒濆鍖栨簮鐮佷粨搴撳強llvm-clang19宸ュ叿閾?        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "褰撳墠浠撳簱锛?GITHUB_REPOSITORY"
          echo "褰撳墠鍒嗘敮锛?GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox &&
          sudo apt-mark hold libc-bin &&
          sudo apt purge man-db &&
          sudo rm -rf /var/lib/man-db/auto-update &&
          sudo apt update &&
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev &
          #鏃х増瀹屾暣鎸囦护锛氾紙鐢变簬缁忚繃楠岃瘉澶ч儴鍒嗘寚浠ゅ凡鍐呯疆浜嶨itHub Action鐜涓紝鏁呰繘琛岀簿绠€锛?          #sudo apt-get install -y --no-install-recommends curl bison flex make binutils git perl gcc python3 python-is-python3 bc libssl-dev libelf-dev libdw-dev zip unzip ccache
          
          #浣跨敤鏈€鏂扮増ccache v4.12.2锛圲buntu杞欢浠撳簱鐨勭増鏈苟闈炴渶鏂帮級
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/ccache-x86-64 -O ccache &&
          sudo cp -f ./ccache /usr/bin/ccache &&
          sudo chmod +x /usr/bin/ccache &&
          rm -f ./ccache &
          
          echo "姝ｅ湪鍏嬮殕婧愮爜浠撳簱..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8850/archive/refs/heads/oneplus/sm8850_v_16.0.0_oneplus_15.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_kernel_common_oneplus_sm8850-oneplus-sm8850_v_16.0.0_oneplus_15" common &&
          rm -rf common.zip &
          
          echo "姝ｅ湪鍏嬮殕llvm-clang19宸ュ叿閾?.." &&
          mkdir -p clang19 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip &&
          unzip -q clang.zip -d clang19 &&
          rm -rf clang.zip &
          
          echo "姝ｅ湪鍏嬮殕Rust 1.82.0宸ュ叿閾?.." &&
          mkdir -p rust &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip &&
          unzip -q rust.zip -d rust &&
          rm -rf rust.zip &
          
          echo "姝ｅ湪鍏嬮殕鏋勫缓宸ュ叿..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          echo "鎵€鏈夋簮鐮佸強llvm-clang19宸ュ叿閾惧垵濮嬪寲瀹屾垚锛?
          echo "姝ｅ湪鍘婚櫎 dirty 鍚庣紑..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 閰嶇疆ccache鐩綍
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "褰撳墠纾佺洏绌洪棿锛?
          df -h
          echo "褰撳墠鏋勫缓鍐呮牳鐗堟湰锛?{{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 杞藉叆褰撳墠鐗堟湰鍐呮牳鐨?ccache缂撳瓨
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 鎷夊彇鍏叡棰勭疆 ccache 缂撳瓨
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "妫€鏌ユ湰鍦扮紦瀛樼姸鎬?.."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "妫€娴嬪埌鏈湴宸叉垚鍔熻浇鍏?ccache 缂撳瓨锛岃烦杩囧叕鍏?ccache 鎷夊彇锛?
            exit 0
          fi
          
          echo "鏈懡涓紦瀛橈紝灏濊瘯鎷夊彇鏈€鏂板叕鍏?ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache; then
            echo "鎴愬姛涓嬭浇 $FILE_NAME锛屾鍦ㄨВ鍘?.."
            tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
            echo "鍏叡 ccache 鎭㈠瀹屾垚锛?
          else
            echo "鍏叡 ccache 涓湭鎵惧埌瀵瑰簲鐨?ccache 鏂囦欢锛屽皢杩涜鍏ㄩ噺鍏ㄦ柊缂栬瘧..."
          fi

      - name: 娓呴櫎鏃?ccache 缂撳瓨
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "姝ｅ湪娓呴櫎浠撳簱涓殑鏃?ccache 缂撳瓨..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "鎴愬姛鍒犻櫎鏃х殑 ccache 缂撳瓨锛?
          else
            echo "鏃х紦瀛樹笉瀛樺湪鎴栧凡琚竻鐞嗭紒"
          fi
      
      - name: 鍒濆鍖栧苟閰嶇疆ccache
        run: |
          # 璁剧疆ccache鐜鍙橀噺
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          # 纭繚ccache鐩綍瀛樺湪
          mkdir -p "$CCACHE_DIR"
          
          # 姣忔杩愯閮介噸鏂伴厤缃紦瀛樺ぇ灏?          echo "閰嶇疆ccache缂撳瓨澶у皬涓? $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          
          # 鏄剧ず鍒濆缂撳瓨鐘舵€?          echo "ccache鍒濆鐘舵€?"
          ccache -s
          
          # 濡傛灉缂撳瓨鎭㈠鍛戒腑锛屾樉绀鸿缁嗕俊鎭?          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缂撳瓨鍛戒腑璇︽儏:"
            ccache -sv
          fi

      - name: 娣诲姞KernelSU
        id: ksu_version
        run: |
          # 杩涘叆鍐呮牳宸ヤ綔鐩綍
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "姝ｅ湪閰嶇疆BakaSU锛堢敱浜嶴ukiSU闀挎湡鏈淮鎶ゆ棤娉曟甯哥紪璇戯紝涓擝akaSU鍏煎sukisu绠＄悊鍣紝鏁匰ukiSU婧愮爜浠撳簱宸查噸瀹氬悜涓篵akasu锛?.."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            # 鐢熸垚鑷畾涔夌増鏈彿锛堝熀浜庢彁浜よ鏁帮級, 澶辫触鏃朵娇鐢?114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            # 瀛樺偍鐗堟湰鍙峰埌 GitHub 鐜鍙橀噺
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            echo "姝ｅ湪閰嶇疆 SukiSU Ultra锛堝畼鏂逛粨搴擄級..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "姝ｅ湪閰嶇疆KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
            cd KernelSU-Next
            rm -rf .git
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
            KSU_GIT_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            #涓篕ernelSU Next娣诲姞WildKSU绠＄悊鍣ㄦ敮鎸?            cd ../common/drivers/kernelsu
            wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/apk_sign.patch
            patch -p2 -N -F 3 < apk_sign.patch || true
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "姝ｅ湪閰嶇疆鍘熺増 KernelSU (tiann/KernelSU)..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cd ./KernelSU
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
          else
            echo "宸查€夋嫨鏃犲唴缃甂ernelSU妯″紡锛岃烦杩嘖ernelSU閰嶇疆..."
          fi

      - name: 淇 SukiSU 6.12 LSM hook
        if: inputs.ksu_type == 'sukisu'
        run: |
          cd kernel_workspace
          python3 - <<'PY'
          p = 'KernelSU/kernel/hook/lsm_hook.c'
          s = open(p).read()
          if 'ksu_lsmid' not in s:
              old = '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");'
              new = (
                  '#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n'
                  '    static struct lsm_id ksu_lsmid = {\n'
                  '        .name = "ksu",\n'
                  '        .id = 0,\n'
                  '    };\n'
                  '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n'
                  '#else\n'
                  '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");\n'
                  '#endif'
              )
              if old not in s:
                  raise SystemExit('LSM hook pattern not found')
              s = s.replace(old, new, 1)
              open(p, 'w').write(s)
          PY

      - name: 鍥哄畾 SukiSU Kbuild 婧愮爜鐩綍
        if: inputs.ksu_type == 'sukisu'
        run: |
          cd kernel_workspace
          test -f common/drivers/kernelsu/Kbuild
          python3 - <<'PY'
          p = 'common/drivers/kernelsu/Kbuild'
          s = open(p).read()
          line = 'KSU_KERNEL_DIR := $(abspath $(srctree)/drivers/kernelsu)\n'
          if line not in s:
              s = line + s
              open(p, 'w').write(s)
          PY
          head -n 4 common/drivers/kernelsu/Kbuild

      - name: 搴旂敤 KernelSU & SUSFS 琛ヤ竵
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "姝ｅ湪娣诲姞susfs琛ヤ竵..."
            if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
              git clone --depth=1 https://github.com/midori01/susfs4ksu.git susfs4ksu -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-dev
            else
