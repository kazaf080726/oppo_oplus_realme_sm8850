            cd kernel_workspace
            #寮€鍚疶CP鎷ュ鎺у埗绠楁硶鎺у埗鍣紙蹇呴渶锛?            echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./common/arch/arm64/configs/gki_defconfig
            ################################################################################################################################
