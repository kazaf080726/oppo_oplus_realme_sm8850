          echo "--- [Wrapper Test] 娴嬭瘯瀹屾瘯 ---"
          chmod +x cc-wrapper ld-wrapper
          echo "--- 缂栬瘧鍓嶇幆澧冩椂闂? $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 缂栬瘧鍓嶇幆澧冩枃浠舵椂闂存埑: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          
          # 6.12鍐呮牳make缂栬瘧鏍稿績閰嶇疆锛?          # 1. 閲嶆槧灏勭墿鐞嗚矾寰?(鐢变簬6.12鍐呮牳寮曞叆浜哛ust浠ｇ爜锛岃绠楀唴鏍哥鍙风増鏈殑宸ュ叿鍙樻垚浜唃endwarfksyms锛岃€実endwarfksyms鏃犳硶姝ｇ‘棰勫鐞嗙粷瀵硅矾寰勶紝鏁呮垜浠渶瑕佹墜鍔ㄦ妸缁濆璺緞閲嶆槧灏勪负鐩稿璺緞锛屽惁鍒欏唴鏍哥鍙锋牎楠屽€间細澶ч潰绉嚭閿?
          COMMON_REAL_PATH=$(pwd -P)
